# Mod metadata for NeoForge. Placeholders are filled in from gradle.properties by the
# generateModMetadata task in build.gradle.
# Format reference: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/InuiDame/Gear-Forge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/InuiDame/Gear-Forge"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Item classes implement the Curios API, so Curios must be present on both sides.
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"
