# Mod metadata for NeoForge. Placeholders are filled in from gradle.properties by the
# generateModMetadata task in build.gradle.
# Format reference: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/InuiDame/Gear-Forge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/InuiDame/Gear-Forge"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# TaCZ bullet interception is applied only when TaCZ is installed.
[[mixins]]
config="${mod_id}.tacz.mixins.json"

# YSM model access guard: restrict the bundled natsu model to our own NPCs only.
[[mixins]]
config="${mod_id}.ysm.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Item classes implement the Curios API, so Curios must be present on both sides.
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"

# TaCZ is required: the boss wields the "Beyond The Lumination" SMG from the
# Bundled Beyond Lumination TaCZ gunpack (icon-only tweaks), released into tacz/ at startup.
# The gunpack data itself is NOT encrypted (unlike the YSM model).
[[dependencies.${mod_id}]]
    modId="tacz"
    type="required"
    versionRange="[1.2.0,)"
    ordering="AFTER"
    side="BOTH"

# 柚鸟夏 Boss/队友用 YSM 假玩家模型渲染，YSM 必需。
[[dependencies.${mod_id}]]
    modId="yes_steve_model"
    type="required"
    versionRange="[2.6,)"
    ordering="AFTER"
    side="BOTH"
